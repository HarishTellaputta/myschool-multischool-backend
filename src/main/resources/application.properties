spring.application.name=student-management
#spring.datasource.url=jdbc:mysql://localhost:3306/student
#spring.datasource.username=root
#spring.datasource.password=root

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/student}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
##server.servlet.context-path=/api/v1
server.port=8080
server.error.include-stacktrace=never


#logging
logging.level.root=INFO
logging.level.com.harish.student_management=DEBUG
logging.file.name=logs/student-management.log

#actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=Student Management System
info.app.version=1.0
info.app.developer=Harish
info.app.company=Personal Project

#redis
#spring.data.redis.host=localhost
#spring.data.redis.port=6379
#spring.cache.type=redis


# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.group-id=student-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*